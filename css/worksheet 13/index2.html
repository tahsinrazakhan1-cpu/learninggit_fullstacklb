<!DOCTYPE html>
<html>
<head>
<style>
    * {
        color: black;              /* 6. Universal */
    }

    p {
        color: blue;               /* 5. Tag */
    }

    .text {
        color: green;              /* 4. Class */
    }

    #heading {
        color: orange;             /* 3. ID */
    }

    p {
        color: purple !important;  /* 1. !important */
    }
</style>
</head>

<body>

<p id="heading" class="text" style="color: red;">
    Hello World
</p>

</body>
</html>
