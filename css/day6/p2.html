<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Indian Flag</title>
    <link rel="stylesheet" href="p2.css">
</head>
<body>
    <main class="flag-scene">
        <div class="flagpole">
            <div class="flagpole-top"></div>
            <div class="flag">
                <div class="stripe saffron"></div>
                <div class="stripe white">
                    <div class="chakra" aria-label="Ashoka Chakra"></div>
                </div>
                <div class="stripe green"></div>
            </div>
            <div class="pole"></div>
            <div class="pole-base"></div>
        </div>
    </main>
</body>
</html>
