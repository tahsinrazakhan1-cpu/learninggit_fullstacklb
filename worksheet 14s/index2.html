<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>csss double box</title>
    <style>
    .parent{
        display: flex;
    }
    .child{
        margin: 50px;
        padding: 50px;
        background-color: green;
        width: 50px;
        height: 50px;
        align-items: center;
    }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child" style="background-color: red; border: 40px solid red;">Hello</div>
        <div class="child">Hello</div>
    </div>
</body>
</html>
