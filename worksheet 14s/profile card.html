<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #ffe4ed 0%, #f6d4ff 30%, #dfe9ff 100%);
        }

        .parent {
            display: grid;
            place-items: center;
            width: 100%;
            padding: 30px 16px;
        }

        .card {
            position: relative;
            width: min(90vw, 420px);
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 28px;
            box-shadow: 0 25px 55px rgba(109, 73, 162, 0.18);
            padding: 28px 24px 22px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .card::before,
        .card::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(12px);
            opacity: 0.8;
        }

        .card::before {
            width: 160px;
            height: 160px;
            background: rgba(255, 151, 206, 0.35);
            top: -55px;
            left: -35px;
        }

        .card::after {
            width: 180px;
            height: 180px;
            background: rgba(123, 140, 255, 0.25);
            bottom: -70px;
            right: -40px;
        }

        .badge {
            position: relative;
            z-index: 1;
            display: inline-block;
            margin: 0 auto 18px;
            padding: 8px 18px;
            border-radius: 999px;
            background: linear-gradient(135deg, #ff9db7, #a78bfa);
            color: white;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 8px 18px rgba(167, 139, 250, 0.35);
        }

        .avatar {
            position: relative;
            z-index: 1;
            width: 128px;
            height: 128px;
            margin: 0 auto 18px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, #ffb3d1, #7c3aed, #5eead4);
            box-shadow: 0 18px 30px rgba(124, 58, 237, 0.25);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            border: 3px solid rgba(255, 255, 255, 0.9);
        }

        h2 {
            position: relative;
            z-index: 1;
            text-align: center;
            font-size: 2rem;
            color: #2b1d47;
            margin-bottom: 8px;
        }

        .role {
            position: relative;
            z-index: 1;
            text-align: center;
            color: #7c3aed;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 14px;
            font-size: 0.8rem;
        }

        .description {
            position: relative;
            z-index: 1;
            text-align: center;
            color: #5f5476;
            line-height: 1.7;
            font-size: 0.96rem;
            margin-bottom: 20px;
        }

        .stats {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .stats span {
            background: linear-gradient(135deg, #fff1f5, #eef2ff);
            color: #3c2b70;
            border: 1px solid rgba(124, 58, 237, 0.1);
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .actions {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .actions a {
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 999px;
            font-weight: 700;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .actions a:hover {
            transform: translateY(-2px);
        }

        .primary {
            background: linear-gradient(135deg, #ff7eb6, #7c3aed);
            color: white;
            box-shadow: 0 10px 20px rgba(124, 58, 237, 0.25);
        }

        .secondary {
            background: white;
            color: #4b3d7d;
            border: 1px solid rgba(124, 58, 237, 0.12);
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="card">
            <div class="badge">Crew Captain</div>

            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=500&q=80" alt="Profile photo" />
            </div>

            <h2>Monkey D. Luffy</h2>
            <p class="role">Straw Hat Pirate</p>
            <p class="description">
                A fearless dreamer with a heart full of freedom, loyalty, and adventure.
                He chases the biggest treasure and the greatest dreams of all.
            </p>

            <div class="stats">
                <span>Gomu Gomu</span>
                <span>Gear 5</span>
                <span>Freedom</span>
            </div>

            <div class="actions">
                <a href="#" class="primary">Follow</a>
                <a href="#" class="secondary">Crew</a>
            </div>
        </div>
    </div>
</body>
</html>
